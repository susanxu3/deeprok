# Same as environment.yml but with a CUDA build of PyTorch, for running the
# network step on an NVIDIA GPU. Linux only -- conda-forge has no CUDA builds
# for macOS; on Apple silicon use environment.yml and pass --device mps.
#
#   conda env create -f environment-nvidia.yml
#   conda activate deeprok-nvidia
#   pip install --no-deps .
#   deeprok -i genome.fna -o genes.gff3 --device cuda
#
# "=cuda*" takes whichever CUDA variant conda-forge has built for this version;
# pin it further (e.g. =cuda126*) to match a specific driver.
name: deeprok-nvidia
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pytorch=2.14.1=cuda*
  - numpy=2.5.4
  - pip
  - pytest=9.1.1
