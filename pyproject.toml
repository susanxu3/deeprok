[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprok"
dynamic = ["version"]
description = "Neural prokaryotic gene finder: CNN+BiLSTM base-level predictions decoded by a segmental ORF HMM"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "TBD" }
authors = [{ name = "Qiaohan Xu" }]
keywords = ["gene prediction", "prokaryote", "genome annotation", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# Ranges here (what the package works with); the exact tested versions are pinned
# in environment.yml / conda-lock files.
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
deeprok = "deeprok.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deeprok.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deeprok = ["data/model.pt", "data/priors.json", "data/model_card.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
