# Exact versions deeprok 0.1.0 was tested with. Create and install with:
#   conda env create -f environment.yml
#   conda activate deeprok
#   pip install --no-deps .
# The PyTorch build is deliberately not pinned: conda installs a CUDA build
# where it can see an NVIDIA driver and a CPU build otherwise, so the same file
# works on a laptop and on a GPU node. See docs/install.md for the GPU notes.
# For a bit-for-bit reproduction on the same platform use the explicit lock file
# instead: conda create -n deeprok --file conda/lock/<linux-64|osx-arm64>.txt
name: deeprok
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pytorch=2.14.1
  - numpy=2.5.4
  - pip
  - pytest=9.1.1
