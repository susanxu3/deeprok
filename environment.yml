# Exact versions deeprok 0.1.0 was tested with (CPU). Create and install with:
#   conda env create -f environment.yml
#   conda activate deeprok
#   pip install --no-deps .
# For a bit-for-bit reproduction on the same platform use the explicit lock file
# instead: conda create -n deeprok --file conda/lock/<linux-64|osx-arm64>.txt
# This file pins the CPU build of PyTorch, so --device cuda will NOT work in it.
# For an NVIDIA GPU use environment-nvidia.yml instead (Linux only); on Apple
# silicon this file is correct and --device mps uses the Mac GPU.
name: deeprok
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pytorch=2.14.1=cpu*
  - numpy=2.5.4
  - pip
  - pytest=9.1.1
